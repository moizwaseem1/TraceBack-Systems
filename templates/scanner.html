{% extends "layout.html" %}

{% block content %}
<main class="fade-in" style="text-align: center; min-height: 70vh; display: flex; flex-direction: column; justify-content: center;">
    
    <div class="hero-section">
        <span class="badge">LIVE SYSTEM</span>
        <h1 class="glitched-text">USERNAME <span class="highlight">SCANNER</span></h1>
        <p class="hero-sub">Initialize deep-web protocol. Scan 40+ verifed nodes.</p>
    </div>

    <div class="terminal-wrapper">
        <div class="terminal-header">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-title">root@traceback:~</div>
        </div>
        
        <div class="terminal-body">
            <div class="input-group">
                <span class="prompt">root@traceback:~#</span>
                <input type="text" id="username" placeholder="Enter target username..." autocomplete="off">
                <button onclick="startScan()">INITIATE</button>
            </div>
            <div id="loader" class="scanning-text hidden">
                <span class="blink">>> ESTABLISHING CONNECTION TO NODES...</span>
            </div>
        </div>
    </div>

    <div id="results" class="grid"></div>

</main>

<script>
    async function startScan() {
        const user = document.getElementById('username').value;
        const resultsDiv = document.getElementById('results');
        const loader = document.getElementById('loader');

        if(!user) return alert("INPUT REQUIRED");

        resultsDiv.innerHTML = '';
        loader.classList.remove('hidden');

        try {
            // Note: This still hits your existing backend route
            const response = await fetch('/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user})
            });

            const data = await response.json();
            loader.classList.add('hidden');

            if (data.length === 0) {
                resultsDiv.innerHTML = '<div class="card" style="justify-content:center; color:#888;">NO DIGITAL FOOTPRINT FOUND.</div>';
                return;
            }

            data.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card slide-up found';
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerHTML = `
                    <span style="font-weight:bold;">${item.site}</span>
                    <a href="${item.url}" target="_blank" style="font-size:0.8rem;">VIEW PROFILE ↗</a>
                `;
                resultsDiv.appendChild(div);
            });

        } catch (e) {
            loader.classList.add('hidden');
            alert("SYSTEM ERROR");
        }
    }
</script>

<style>
    /* Local styles just for scanner */
    .hidden { display: none; }
</style>
{% endblock %}
