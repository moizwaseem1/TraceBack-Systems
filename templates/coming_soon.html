<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceBack Systems | Access Restricted</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff41;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- CRT OVERLAY EFFECT --- */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        /* --- GLITCH TITLE --- */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: -2px;
            position: relative;
            text-transform: uppercase;
        }

        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
        }

        h1::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(30px, 9999px, 10px, 0); }
            5% { clip: rect(70px, 9999px, 90px, 0); }
            100% { clip: rect(10px, 9999px, 50px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(15px, 9999px, 60px, 0); }
            100% { clip: rect(80px, 9999px, 30px, 0); }
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        /* --- LOADER --- */
        .loader-box {
            border: 1px solid #333;
            height: 4px;
            width: 100%;
            background: #111;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }
        
        .loader-bar {
            height: 100%;
            background: var(--neon);
            width: 100%;
            position: absolute;
            animation: loading 3s ease-in-out infinite;
            box-shadow: 0 0 20px var(--neon);
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }

        /* --- TERMINAL OUTPUT --- */
        .terminal-output {
            text-align: left;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-left: 2px solid var(--neon);
            min-height: 100px;
            font-family: 'Courier New', Courier, monospace;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--neon);
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* MOBILE ADJUST */
        @media(max-width: 600px) {
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glitch-wrapper">
            <h1 data-text="TRACEBACK_SYSTEMS">TRACEBACK_SYSTEMS</h1>
        </div>
        <div class="subtitle">ADVANCED OSINT INTELLIGENCE // V1.0</div>

        <div class="loader-box">
            <div class="loader-bar"></div>
        </div>

        <div class="terminal-output" id="console">
            </div>
    </div>

    <script>
        const consoleDiv = document.getElementById('console');
        const messages = [
            "> INITIALIZING KERNEL...",
            "> LOADING MODULES: [OSINT, SCANNERS, API]...",
            "> ENCRYPTING CONNECTION... [OK]",
            "> ESTABLISHING SECURE PROTOCOL...",
            "> STATUS: LAUNCH IMMINENT.",
            "> STAND BY FOR DEPLOYMENT..."
        ];

        let lineIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (lineIndex < messages.length) {
                if (charIndex === 0) {
                    const newLine = document.createElement('div');
                    newLine.id = "line-" + lineIndex;
                    consoleDiv.appendChild(newLine);
                }
                
                const currentLine = messages[lineIndex];
                document.getElementById("line-" + lineIndex).innerHTML = 
                    currentLine.substring(0, charIndex + 1) + '<span class="cursor"></span>';

                // Remove cursor from previous lines
                if (lineIndex > 0) {
                     const prevLine = document.getElementById("line-" + (lineIndex - 1));
                     if(prevLine) prevLine.innerHTML = messages[lineIndex - 1]; 
                }

                charIndex++;

                if (charIndex < currentLine.length) {
                    setTimeout(typeWriter, 30); // Typing speed
                } else {
                    charIndex = 0;
                    lineIndex++;
                    setTimeout(typeWriter, 800); // Pause between lines
                }
            } else {
                // Keep cursor blinking on last line
                document.getElementById("line-" + (messages.length - 1)).innerHTML = 
                    messages[messages.length - 1] + '<span class="cursor"></span>';
            }
        }

        window.onload = typeWriter;
    </script>
</body>
  </html>
